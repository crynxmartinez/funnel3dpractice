<!--
  ============================================================
  GHL PASTE BLOCK 3 of 3 — lens dive (push-in to the sensor)
  ============================================================
  A pinned scroll sequence that travels from a front-on hero,
  through 21 elements of glass, past the nine-blade iris, and
  lands on the bare 45MP sensor filling the frame.

  Paste into a GoHighLevel *Custom Code / HTML* element. Same
  rules as the teardown block:

    - FULL-WIDTH, ONE-COLUMN row, padding 0. GHL wraps elements
      in flex rows that often carry `overflow: hidden`, which
      silently breaks `position: sticky`. The script detects
      that and falls back to fixed, but a clean row avoids it.
    - Test on the PUBLISHED page. The builder preview usually
      does not run JS, so this looks like an empty box in the
      editor.

  Everything is prefixed r5l- and scoped under #r5l-lens, so it
  cannot collide with GHL's CSS or with the other two blocks.

  PLACEMENT: this is the sensor argument, so it belongs AFTER
  your "who it's for" content and BEFORE your R5-vs-R5-II
  comparison — the dive ends on the sensor and a comparison
  table's first row is the sensor, which hands off cleanly.

  NOTE ON COPY: do not repeat the 45MP/stacked/rolling-shutter
  claims elsewhere on the page. This block owns them, because
  here the sensor is the entire frame. The teardown block's
  equivalent beat deliberately covers the stabiliser instead.

  WEIGHT: 6.45 MB desktop / 1.59 MB mobile, lazy-gated — nothing
  loads until the reader is about 1.5 screens away.
-->

<div class="r5l-scroll" id="r5l-lens">
  <div class="r5l-pin">
    <canvas class="r5l-canvas" role="img"
            aria-label="The view travelling into the lens, through the aperture blades, ending on the bare image sensor"></canvas>
    <div class="r5l-scrim"></div>
    <div class="r5l-beats"></div>
    <div class="r5l-loader" role="progressbar" aria-label="Loading frames"
         aria-valuemin="0" aria-valuemax="100"></div>
  </div>
</div>

<style>
#r5l-lens {
  position: relative;
  height: 600vh;
  background: #07070a;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
               Helvetica, Arial, sans-serif;
  color: #f3f3f6;
}
#r5l-lens * { box-sizing: border-box; }

#r5l-lens .r5l-pin {
  position: sticky; top: 0;
  height: 100vh; height: 100svh;
  overflow: hidden;
}
/* Applied by the script if sticky turns out to be blocked by an ancestor.
   Three states are required, not two: parked at the top before the section,
   fixed while inside it, and parked at the BOTTOM once past. Without the
   third the canvas snaps back to the section's top edge on exit and
   disappears for the rest of the scroll. */
#r5l-lens.r5l-fixedfallback .r5l-pin {
  position: absolute; top: 0; left: 0; right: 0;
}
#r5l-lens.r5l-fixedfallback.r5l-inview .r5l-pin {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1;
}
#r5l-lens.r5l-fixedfallback.r5l-past .r5l-pin {
  position: absolute; top: auto; bottom: 0; left: 0; right: 0;
}

#r5l-lens .r5l-canvas {
  position: absolute; inset: 0;
  display: block; width: 100%; height: 100%;
  background: #07070a;
}

/* The teardown leaves the left third of frame empty, so its copy sits in a
   column behind a side gradient. This sequence is radially symmetric and
   fills the entire frame at every moment, so a column would land straight on
   the iris. Copy goes in a bottom band behind a bottom-up scrim instead. */
#r5l-lens .r5l-scrim {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(0deg,
    rgba(7,7,10,.97) 0%, rgba(7,7,10,.9) 24%,
    rgba(7,7,10,.5) 45%, rgba(7,7,10,0) 68%);
  /* Starts strong and deepens: the sensor at the end is the brightest thing
     in the sequence, so the copy needs more ground under it. */
  opacity: calc(.74 + var(--r5l-p, 0) * .26);
}

#r5l-lens .r5l-beats { position: absolute; inset: 0; }

#r5l-lens .r5l-beat {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
  align-items: flex-start;
  padding: 6rem clamp(1.25rem, 5vw, 5.5rem) 4.5rem;
  opacity: 0; visibility: hidden;
  pointer-events: none;
  will-change: opacity, transform;
}
#r5l-lens .r5l-beat > * { max-width: 40rem; pointer-events: auto; }

#r5l-lens .r5l-eyebrow {
  margin: 0 0 1.1rem; font-size: .72rem; letter-spacing: .2em;
  text-transform: uppercase; color: #ff7a45; font-weight: 600;
}
#r5l-lens .r5l-title {
  margin: 0 0 1.4rem;
  font-size: clamp(2.1rem, 4.4vw, 3.9rem);
  line-height: .98; letter-spacing: -.04em; font-weight: 600; color: #f3f3f6;
}
#r5l-lens .r5l-body {
  margin: 0 0 2rem; font-size: clamp(1rem, 1.35vw, 1.14rem);
  line-height: 1.62; color: #cfcfd8; max-width: 48ch;
}
#r5l-lens .r5l-stats {
  display: flex; flex-wrap: wrap; gap: 2.4rem; margin: 0 0 1.5rem;
}
#r5l-lens .r5l-stats dt {
  font-size: clamp(1.5rem, 2.6vw, 2.1rem);
  font-weight: 600; letter-spacing: -.035em; line-height: 1;
}
#r5l-lens .r5l-stats dd {
  margin: .4rem 0 0; font-size: .78rem; letter-spacing: .04em;
  color: #9b9baa; text-transform: uppercase;
}
#r5l-lens .r5l-hint {
  display: flex; align-items: center; gap: .75rem; margin: 1.5rem 0 0;
  font-size: .75rem; letter-spacing: .14em; text-transform: uppercase;
  color: #6f6f7e;
}
#r5l-lens .r5l-hint i {
  width: 46px; height: 1px; background: rgba(255,255,255,.16);
  display: block; position: relative; overflow: hidden;
}
#r5l-lens .r5l-hint i::after {
  content: ''; position: absolute; inset: 0; background: #ff7a45;
  animation: r5l-sweep 2.2s cubic-bezier(.22,.7,.28,1) infinite;
}
@keyframes r5l-sweep {
  0% { transform: translateX(-100%); }
  60%, 100% { transform: translateX(100%); }
}
#r5l-lens .r5l-cta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: .95rem 1.7rem; border-radius: 999px;
  background: #ff7a45; color: #1c0b03;
  font-weight: 600; font-size: .95rem; text-decoration: none;
  transition: transform .25s, background-color .25s;
}
#r5l-lens .r5l-cta:hover { transform: translateY(-2px); background: #ff8d5e; }

#r5l-lens .r5l-loader {
  position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: rgba(255,255,255,.07); transition: opacity .6s .2s;
}
#r5l-lens .r5l-loader::after {
  content: ''; position: absolute; inset: 0 auto 0 0;
  width: var(--r5l-load, 0%); background: #ff7a45;
  transition: width .3s linear;
}
#r5l-lens.is-ready .r5l-loader { opacity: 0; }

/* Mobile: image band on top, copy beneath — never crop 16:9 into portrait. */
@media (max-width: 768px) {
  #r5l-lens { height: 520vh; }
  #r5l-lens .r5l-canvas { inset: 0 0 auto 0; height: 48vh; }
  #r5l-lens .r5l-beats { top: 44vh; }
  #r5l-lens .r5l-beat {
    justify-content: flex-start;
    padding: 1rem clamp(1.25rem, 5vw, 5.5rem) 4.5rem;
  }
  #r5l-lens .r5l-beat > * { max-width: none; }
  #r5l-lens .r5l-stats { gap: 1.5rem; }
  #r5l-lens .r5l-scrim {
    background: linear-gradient(180deg,
      rgba(7,7,10,.5) 0%, rgba(7,7,10,0) 24%,
      rgba(7,7,10,.72) 42%, #07070a 55%);
  }
}

/* No pin and no scroll-jacking for readers who asked for less motion. */
@media (prefers-reduced-motion: reduce) {
  #r5l-lens { height: auto; }
  #r5l-lens .r5l-pin { position: static; height: auto; }
  #r5l-lens .r5l-canvas {
    position: relative; inset: auto; height: min(62vh, 480px);
  }
  #r5l-lens .r5l-scrim, #r5l-lens .r5l-loader, #r5l-lens .r5l-hint { display: none; }
  #r5l-lens .r5l-beats { position: static; }
  #r5l-lens .r5l-beat {
    position: static; opacity: 1 !important; visibility: visible !important;
    transform: none !important;
    padding: 3.5rem clamp(1.25rem, 5vw, 5.5rem);
    border-top: 1px solid rgba(255,255,255,.09);
  }
}
</style>

<script>
(function () {
  'use strict';

  /* ========================================================
     >>> THE ONE LINE TO CHANGE <<<
     Public HTTPS origin, no trailing slash.
     Pin a commit SHA instead of @main for a live page.
     ======================================================== */
  var FRAME_BASE = 'https://cdn.jsdelivr.net/gh/crynxmartinez/funnel3dpractice@main';

  var COUNTS = { desktop: 240, mobile: 120 };
  var LADDER_STEP = 12, CONCURRENCY = 6;
  /* Slightly heavier glide than the teardown: this is one continuous dolly
     move rather than discrete parts separating, so it reads better with more
     inertia. */
  var SMOOTHING = 0.13;
  var STATIC_AT = 1.0;   // reduced-motion still: the bare sensor, the best frame

  var BEATS = [
    { from:0, to:0.20, eyebrow:'The light path',
      title:'Follow the light<br>all the way in.',
      body:'Every photograph is a negotiation between glass and silicon. Here is the whole journey, from the front element to the thing that finally records it.',
      hint:'Scroll to travel inward' },
    { from:0.20, to:0.48, eyebrow:'01 — The glass',
      title:'Twenty-one elements,<br>fifteen groups.',
      body:'Three ultra-low dispersion and three aspherical elements pull the colours back into register before they ever reach the sensor. Fluorine coating on the front and rear surfaces sheds water and fingerprints.',
      stats:[['21','elements'],['15','groups'],['82','mm filter thread']] },
    { from:0.48, to:0.76, eyebrow:'02 — The aperture',
      title:'Nine blades,<br>held wide open.',
      body:'A rounded nine-blade diaphragm keeps out-of-focus highlights circular instead of polygonal. And f/2.8 holds from 24 mm all the way to 70 mm, so your exposure does not shift when you reframe.',
      stats:[['f/2.8','constant'],['9','rounded blades'],['24-70','mm range']] },
    { from:0.76, to:1, eyebrow:'03 — The sensor',
      title:'And this is<br>where it lands.',
      body:'Forty-five million pixels on a stacked, back-illuminated sensor. Stacking the readout circuitry behind the photosites clears the light path and drains the frame far faster — rolling shutter skew falls roughly 60% against the original R5. Propellers stay straight. Strobes stay clean.',
      stats:[['8192','× 5464 pixels'],['60%','less skew vs R5'],['1/32000','electronic shutter']],
      cta:{ label:'See the price', href:'#offer' } }
  ];

  var stage = document.getElementById('r5l-lens');
  if (!stage) return;
  var canvas = stage.querySelector('.r5l-canvas');
  var overlay = stage.querySelector('.r5l-beats');
  var loader = stage.querySelector('.r5l-loader');
  var ctx = canvas.getContext('2d', { alpha: false });

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tierName, count, dir, frames, poster = null;
  var target = 0, current = 0, lastDrawn = -1, running = false, started = false;
  var stickyChecked = false;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function resolveTier() {
    if (frames && frames.some(Boolean)) return;
    var wide = (canvas.clientWidth || document.documentElement.clientWidth) > 768;
    var next = wide ? 'desktop' : 'mobile';
    if (next === tierName) return;
    tierName = next; count = COUNTS[tierName];
    dir = FRAME_BASE + '/assets/frames/lens/' + tierName;
    frames = new Array(count); lastDrawn = -1;
  }

  function loadImage(src, noCors) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.decoding = 'async';
      /* Ask for CORS so the canvas stays untainted and readable. jsDelivr, S3
         and GitHub Pages all send access-control-allow-origin. A host that does
         not would make the load fail outright, so retry once without it — a
         tainted canvas still displays perfectly, it just cannot be read back. */
      if (!noCors) im.crossOrigin = 'anonymous';
      im.onload = function () { res(im); };
      im.onerror = function () {
        if (!noCors) { loadImage(src, true).then(res, rej); return; }
        rej(new Error(src));
      };
      im.src = src;
    });
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    lastDrawn = -1; draw(current, true);
  }

  function paint(img) {
    var cw = canvas.width, ch = canvas.height;
    ctx.fillStyle = '#07070a'; ctx.fillRect(0, 0, cw, ch);
    if (!img) return;
    var s = Math.min(cw / img.naturalWidth, ch / img.naturalHeight);
    var w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function nearest(i) {
    if (frames[i]) return frames[i];
    for (var d = 1; d < count; d++) {
      if (frames[i - d]) return frames[i - d];
      if (frames[i + d]) return frames[i + d];
    }
    return poster;
  }

  function draw(f, force) {
    var i = clamp(Math.round(f), 0, count - 1);
    if (i === lastDrawn && !force) return;
    lastDrawn = i; paint(nearest(i));
  }

  var beats = [];
  function buildBeats() {
    overlay.innerHTML = '';
    BEATS.forEach(function (b) {
      var el = document.createElement('article');
      el.className = 'r5l-beat';
      var h = '';
      if (b.eyebrow) h += '<p class="r5l-eyebrow">' + b.eyebrow + '</p>';
      if (b.title)   h += '<h2 class="r5l-title">' + b.title + '</h2>';
      if (b.body)    h += '<p class="r5l-body">' + b.body + '</p>';
      if (b.stats) {
        h += '<dl class="r5l-stats">';
        b.stats.forEach(function (s) { h += '<div><dt>' + s[0] + '</dt><dd>' + s[1] + '</dd></div>'; });
        h += '</dl>';
      }
      if (b.cta)  h += '<a class="r5l-cta" href="' + b.cta.href + '">' + b.cta.label + '</a>';
      if (b.hint) h += '<p class="r5l-hint"><i></i>' + b.hint + '</p>';
      el.innerHTML = h;
      overlay.appendChild(el);
      beats.push({ el: el, from: b.from, to: b.to });
    });
  }

  /* The closing beat holds instead of fading: its band ends at exactly 1.0,
     so fading it would blink the copy and its CTA out at the bottom. */
  function opacityFor(b, p) {
    var last = b.to >= 1;
    if (p <= b.from) return 0;
    if (p >= b.to && !last) return 0;
    var fade = (b.to - b.from) * 0.26;
    return Math.min(1, (p - b.from) / fade, last ? Infinity : (b.to - p) / fade);
  }

  function updateBeats(p) {
    beats.forEach(function (b) {
      var o = opacityFor(b, p);
      if (o === b.last) return;
      b.last = o;
      b.el.style.opacity = o;
      b.el.style.transform = 'translate3d(0,' + ((1 - o) * 16).toFixed(1) + 'px,0)';
      b.el.style.visibility = o < 0.01 ? 'hidden' : 'visible';
    });
  }

  function progress() {
    var travel = stage.offsetHeight - window.innerHeight;
    if (travel <= 0) return 0;
    return clamp(-stage.getBoundingClientRect().top / travel, 0, 1);
  }

  function tick() {
    var d = target - current;
    if (Math.abs(d) < 0.01) { current = target; running = false; }
    else { current += d * SMOOTHING; requestAnimationFrame(tick); }
    draw(current);
  }

  /* GHL nests content in flex rows, and an ancestor with `overflow: hidden`
     silently kills `position: sticky`. Detect it once, mid-section, and switch
     to fixed positioning if the pin is not actually holding. */
  function checkSticky(p) {
    if (stickyChecked || p < 0.15 || p > 0.85) return;
    stickyChecked = true;
    var pin = stage.querySelector('.r5l-pin');
    if (Math.abs(pin.getBoundingClientRect().top) > 4) {
      stage.classList.add('r5l-fixedfallback');
      console.warn('[r5l] position:sticky is being blocked by an ancestor ' +
        '(most likely overflow:hidden on a GHL row). Switched to fixed. ' +
        'For a clean fix, put this block in a full-width one-column row.');
    }
  }

  function onScroll() {
    var p = progress();
    checkSticky(p);
    if (stage.classList.contains('r5l-fixedfallback')) {
      var r = stage.getBoundingClientRect();
      var during = r.top <= 0 && r.bottom >= window.innerHeight;
      stage.classList.toggle('r5l-inview', during);
      stage.classList.toggle('r5l-past', !during && r.bottom < window.innerHeight);
    }
    target = p * (count - 1);
    updateBeats(p);
    stage.style.setProperty('--r5l-p', p.toFixed(4));
    if (!running) { running = true; requestAnimationFrame(tick); }
  }

  function ladder() {
    var out = [];
    for (var i = 0; i < count; i += LADDER_STEP) out.push(i);
    if (out[out.length - 1] !== count - 1) out.push(count - 1);
    return out;
  }

  function loadInto(i) {
    return loadImage(dir + '/f' + String(i + 1).padStart(3, '0') + '.webp')
      .then(function (im) { frames[i] = im; })
      .catch(function () { /* one dropped frame is survivable */ });
  }

  function backfill() {
    var pending = [];
    for (var i = 0; i < count; i++) if (!frames[i]) pending.push(i);
    function next() {
      if (!pending.length) return Promise.resolve();
      var here = Math.round(current), at = 0, best = Infinity;
      for (var k = 0; k < pending.length; k++) {
        var d = Math.abs(pending[k] - here);
        if (d < best) { best = d; at = k; }
      }
      var idx = pending.splice(at, 1)[0];
      return loadInto(idx).then(function () {
        if (frames[idx] && Math.abs(idx - Math.round(current)) <= 1) draw(current, true);
        return next();
      });
    }
    var w = [];
    for (var j = 0; j < CONCURRENCY; j++) w.push(next());
    return Promise.all(w);
  }

  function start() {
    if (started) return;
    started = true;
    resolveTier();
    var lad = ladder(), done = 0;

    loadImage(FRAME_BASE + '/assets/poster-lens.webp')
      .then(function (im) { poster = im; draw(current, true); })
      .catch(function () {
        console.error('[r5l] Could not load the poster from ' + FRAME_BASE +
          ' — check FRAME_BASE is a PUBLIC https origin. A private repo will 404.');
      })
      .then(function () {
        return Promise.all(lad.map(function (i) {
          return loadInto(i).then(function () {
            done++;
            if (loader) loader.style.setProperty('--r5l-load',
              Math.round(done / lad.length * 100) + '%');
            draw(current, true);
          });
        }));
      })
      .then(function () { stage.classList.add('is-ready'); return backfill(); });
  }

  function boot() {
    resolveTier();
    buildBeats();
    resize();

    /* RO not window.onresize: a canvas can have zero layout size at boot
       (hidden tab, collapsed builder container) and becoming visible fires no
       resize event, which would leave the bitmap at its 300x150 default. */
    if ('ResizeObserver' in window) {
      new ResizeObserver(function () { resize(); if (!reduced) onScroll(); }).observe(canvas);
    }
    addEventListener('resize', function () { resize(); if (!reduced) onScroll(); });

    if (reduced) {
      beats.forEach(function (b) {
        b.el.style.opacity = 1; b.el.style.visibility = 'visible';
      });
      var idx = Math.round(STATIC_AT * (count - 1));
      loadInto(idx).then(function () { resize(); draw(idx, true); });
      return;
    }

    addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    /* Below the fold: hold off on ~6.5 MB until the reader is heading this way.
       150% of viewport gives about 1.5 screens of runway. */
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) {
        if (es.some(function (e) { return e.isIntersecting; })) { io.disconnect(); start(); }
      }, { rootMargin: '150% 0px' });
      io.observe(stage);
    } else {
      start();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
